<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form action="feedback.php" method="post">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" size="30" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" size="30" required>
        <br><br>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4" cols="40" required></textarea>
        <br><br>

        <p>Rating:</p>

        <input type="radio" id="excellent" name="rating" value="5" required>
        <label for="excellent">Excellent</label>

        <input type="radio" id="average" name="rating" value="3">
        <label for="average">Average</label>

        <input type="radio" id="poor" name="rating" value="1">
        <label for="poor">Poor</label>

        <br><br>

        <input type="submit" value="Submit Feedback">
        <input type="reset" value="Clear All Fields">

    </form>

</body>
</html>
